            /* 平板设备优化 */

                    font-size: 9px !important;
                }
                
                #timeDisplay .text-sm {
                    font-size: 0.75rem !important;
                }
                
                /* 调整按键位置 - 增加间距并向左移动更多 */
                .hit-area[id="hitArea1"] {
                    left: calc(50% - 125px) !important;
                }
                .hit-area[id="hitArea2"] {
                    left: calc(50% - 50px) !important;
                }
                .hit-area[id="hitArea3"] {
                    left: calc(50% + 25px) !important;
                }
                .hit-area[id="hitArea4"] {
                    left: calc(50% + 100px) !important;
                }
                
                /* 计时器调整 - 平板 */
                #timeDisplay {
                    width: 90px !important;
                    height: 90px !important;
                    font-size: 0.8rem !important;
                    padding: 0.4rem !important;
                }
                
                #timeDisplay .text-\[\10px\] {
                    font-size: 9px !important;
                }
                
                #timeDisplay .text-sm {
                    font-size: 0.75rem !important;
                }
                
                /* 计时器调整 - 平板 */
                #timeDisplay {
                    width: 90px !important;
                    height: 90px !important;
                    font-size: 0.8rem !important;
                    padding: 0.4rem !important;
                }
                
                #timeDisplay .text-\[\10px\] {
                    font-size: 9px !important;
                }
                
                #timeDisplay .text-sm {
                    font-size: 0.75rem !important;
                }

                }

            .animate-fade-in {
                animation: fadeIn 0.5s ease-in-out;
            }
            
            @keyframes fadeIn {
                from {
                    opacity: 0;
                    transform: translateY(10px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }

    </style>
    <style>
        body {
            overflow: hidden;
            touch-action: manipulation;
            user-select: none;
        }
        
        #gameCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        
        .note {
            position: absolute;
            width: 60px;
            height: 60px;
            background-size: 600% 600%;
            background-repeat: no-repeat;
            background-position: center;
            z-index: 10;
            border-radius: 50%;
            overflow: hidden;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
        }
        
        .slide-note {
            position: absolute;
            width: 60px;
            background-size: 600% 600%;
            background-repeat: no-repeat;
            background-position: center;
            z-index: 9;
            border-radius: 30px;
            overflow: hidden;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
        }
        
        .judge-text {
            position: absolute;
            font-weight: bold;
            font-size: 24px;
            z-index: 20;
            pointer-events: none;
            text-shadow: 0 0 5px rgba(0, 0, 0, 0.8);
            transform: translate(-50%, -50%);
        }
        
        .judge-marvelous {
            color: #ff00ff;
            font-size: 28px;
            text-shadow: 0 0 10px rgba(255, 0, 255, 0.8);
        }
        
        .judge-perfect {
            color: #00ffff;
            text-shadow: 0 0 8px rgba(0, 255, 255, 0.6);
        }
        
        .judge-good {
            color: #ffff00;
        }
        
        .judge-miss {
            color: #ff0000;
        }
        
        .hit-area {
            position: absolute;
            bottom: 100px;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-weight: bold;
            font-size: 20px;
            z-index: 5;
            transition: all 0.1s ease;
        }
        
        .hit-area.active {
            transform: scale(1.1);
            border-color: white;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.8);
        }
        
        .hit-effect {
            position: absolute;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,0.8) 0%, rgba(255,255,255,0) 70%);
            transform: scale(0);
            z-index: 4;
        }
        
        .score-popup {
            position: absolute;
            color: white;
            font-weight: bold;
            font-size: 24px;
            z-index: 20;
            pointer-events: none;
            opacity: 0;
        }
        
        .combo-display {
            position: absolute;
            top: 20%;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 48px;
            font-weight: bold;
            z-index: 15;
            text-align: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        .combo-number {
            font-size: 72px;
        }
        
        .particle {
            position: absolute;
            width: 8px;
            height: 8px;
            background-color: white;
            border-radius: 50%;
            pointer-events: none;
            z-index: 25;
        }
        
        @keyframes hit-animation {
            0% { transform: scale(0); opacity: 1; }
            100% { transform: scale(2); opacity: 0; }
        }
        
        @keyframes score-animation {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(-50px); opacity: 0; }
        }
        
        @keyframes particle-animation {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(0); opacity: 0; }
        }
        
        .button-3d {
            transform-style: preserve-3d;
            transition: transform 0.1s;
        }
        
        .button-3d:active {
            transform: translateZ(-10px);
        }
        
        .button-3d::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background: rgba(0, 0, 0, 0.2);
            transform: translateZ(-10px);
        }
    </style>
</head>

        // 绑定事件监听器
        function bindEventListeners() {
            // Start button

            // Pause button

            elements.hardcoreMode.addEventListener('click', () => setDifficulty('hardcore'));
            elements.fallenMode.addEventListener('click', () => setDifficulty('fallen'));
            
            // 键盘事件
            document.addEventListener('keydown', handleKeyDown);
            document.addEventListener('keyup', handleKeyUp);
            
            // 触摸事件（移动设备支持）
            const hitAreas = [elements.hitArea1, elements.hitArea2, elements.hitArea3, elements.hitArea4];
            hitAreas.forEach((hitArea, index) => {
                hitArea.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    handleKeyDown({ code: Object.keys(gameConfig.keyMapping)[index] });
                });
                
                hitArea.addEventListener('touchend', (e) => {
                    e.preventDefault();
                    handleKeyUp({ code: Object.keys(gameConfig.keyMapping)[index] });

        // 更新时间显示
        function updateTimeDisplay() {
            if (!gameState.isPlaying || gameState.isPaused) return;
            
            const currentTime = Date.now();
            const elapsedTime = currentTime - gameState.gameStartTime;
            const timeLeft = Math.max(0, gameConfig.gameDuration - elapsedTime);
            
            // 格式化时间为 MM:SS 格式
            const formatTime = (milliseconds) => {
                const totalSeconds = Math.floor(milliseconds / 1000);
                const minutes = Math.floor(totalSeconds / 60);
                const seconds = totalSeconds % 60;
                return `${minutes}:${seconds.toString().padStart(2, '0')}`;
            };
            
            // 更新显示
            document.getElementById('timeElapsedDisplay').textContent = formatTime(elapsedTime);
            document.getElementById('timeLeftDisplay').textContent = formatTime(timeLeft);
            
            // 根据剩余时间改变颜色
            const timeLeftElement = document.getElementById('timeLeftDisplay');
            if (timeLeft <= 10000) { // 10秒以下
                timeLeftElement.classList.add('text-red-500');
                timeLeftElement.classList.remove('text-white');
            } else if (timeLeft <= 30000) { // 30秒以下
                timeLeftElement.classList.add('text-yellow-500');
                timeLeftElement.classList.remove('text-white', 'text-red-500');
            } else {
                timeLeftElement.classList.add('text-white');
                timeLeftElement.classList.remove('text-yellow-500', 'text-red-500');
            }
        }
        
        // Start game
        function startGame() {
            // 更新游戏配置为当前难度
            const difficultyConfig = gameConfig.difficulty[gameState.currentDifficulty];
            gameConfig.minNoteSpeed = difficultyConfig.minNoteSpeed;
            gameConfig.maxNoteSpeed = difficultyConfig.maxNoteSpeed;
            gameConfig.noteInterval = difficultyConfig.noteInterval;
            gameConfig.hitWindow = difficultyConfig.hitWindow;
            gameConfig.slideNoteChance = difficultyConfig.slideNoteChance;
            
            // 重置游戏状态
            resetGameState();
            
            // 显示游戏界面
            elements.startScreen.classList.add('hidden');
            elements.gameScreen.classList.remove('hidden');
            
            // Start game
            gameState.isPlaying = true;
            gameState.gameStartTime = Date.now();
            
            // 生成音符
            startNoteGenerator();
            
            // 设置游戏结束计时器
            gameState.gameTimer = setTimeout(endGame, gameConfig.gameDuration);
            
            // 启动时间更新计时器
            gameState.timeUpdateTimer = setInterval(updateTimeDisplay, 1000);
            
            // Start game循环
            gameLoop();
            
            // 播放背景音乐
            playBackgroundMusic();

        // 重置游戏状态
        function resetGameState() {
            gameState.score = 0;
            gameState.combo = 0;
            gameState.maxCombo = 0;
            gameState.isPlaying = false;
            gameState.isPaused = false;
            gameState.notes = [];
            gameState.noteIdCounter = 0;
            gameState.gameStartTime = 0;
            
            // 清除所有计时器
            if (gameState.gameTimer) clearTimeout(gameState.gameTimer);
            if (gameState.noteGeneratorTimer) clearInterval(gameState.noteGeneratorTimer);
            if (gameState.timeUpdateTimer) clearInterval(gameState.timeUpdateTimer);
            
            // 清除所有音符
            elements.noteArea.innerHTML = '';
            
            // 更新UI
            elements.scoreDisplay.textContent = '0';
            elements.comboNumber.textContent = '0';
            elements.comboDisplay.style.opacity = '0';
        }
        
        // 开始生成音符
        function startNoteGenerator() {
            gameState.noteGeneratorTimer = setInterval(() => {
                if (!gameState.isPaused) {
                    generateNote();
                }
            }, gameConfig.noteInterval);
        }
        
        // 生成音符
        function generateNote() {
            // 限制同时存在的音符数量，避免性能问题
            if (gameState.notes.length >= 25) {
                return; // 如果音符太多，暂时不生成新音符
            }
            
            // 尝试找到一个合适的轨道，避免音符重叠
            const availableLanes = [0, 1, 2, 3];
            let selectedLane = -1;
            
            // 随机打乱轨道顺序
            for (let i = availableLanes.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [availableLanes[i], availableLanes[j]] = [availableLanes[j], availableLanes[i]];
            }
            
            // 检查每个轨道是否有足够空间放置新音符
            for (const lane of availableLanes) {
                if (isLaneAvailable(lane)) {
                    selectedLane = lane;
                    break;
                }
            }
            
            // 如果没有合适的轨道，暂时不生成音符
            if (selectedLane === -1) {
                return;
            }
            
            const noteId = gameState.noteIdCounter++;
            
            // 随机决定是普通音符还是滑条音符
            const isSlideNote = Math.random() < gameConfig.slideNoteChance;
            
            if (isSlideNote) {
                generateSlideNote(selectedLane, noteId);
            } else {
                generateRegularNote(selectedLane, noteId);
            }
        }
        
        // 检查轨道是否有足够空间放置新音符
        function isLaneAvailable(lane) {
            const currentTime = Date.now();
            const minGap = gameConfig.noteInterval * 0.7; // 音符之间的最小间隔
            
            // 检查该轨道上最近生成的音符
            const recentNotes = gameState.notes.filter(note => 
                note.lane === lane && 
                currentTime - note.createdTime < minGap
            );
            
            return recentNotes.length === 0;
        }
        
        // 生成普通音符
        function generateRegularNote(lane, noteId) {
            // 创建音符元素
            const note = document.createElement('div');
            note.className = 'note note-shadow';
            note.id = `note-${noteId}`;
            note.dataset.lane = lane;
            note.dataset.id = noteId;
            
            // 设置音符位置和样式 - 确保与按键中心对齐
            const hitArea = document.getElementById(`hitArea${lane + 1}`);
            const hitAreaRect = hitArea.getBoundingClientRect();
            
            // 使用动态计算的音符大小，确保与按键完全对齐
            note.style.left = `${hitAreaRect.left + hitAreaRect.width / 2 - noteWidth / 2}px`;
            note.style.top = `-${noteHeight}px`;
            note.style.width = `${noteWidth}px`;
            note.style.height = `${noteHeight}px`;
            
            // 使用与滑条音符相同的风格
            note.style.backgroundColor = getLaneColor(lane, 0.8);
            note.style.background = `linear-gradient(to bottom, ${getLaneColor(lane, 1)}, ${getLaneColor(lane, 0.6)})`;
            
            // 添加发光效果
            note.style.boxShadow = `0 0 15px ${getLaneColor(lane, 0.8)}`;
            
            // 添加音符到游戏区域
            elements.noteArea.appendChild(note);
            
            // 随机音符速度
            const speed = gameConfig.minNoteSpeed + Math.random() * (gameConfig.maxNoteSpeed - gameConfig.minNoteSpeed);
            
            // 添加到游戏状态
            gameState.notes.push({
                id: noteId,
                lane,
                element: note,
                position: -noteHeight,
                hit: false,
                speed: speed,
                type: 'regular',
                createdTime: Date.now()
            });
            
            // 增加总音符计数
            gameState.totalNotes++;
        }
        
        // 生成滑条音符
        function generateSlideNote(lane, noteId) {
            // 创建滑条音符元素
            const slideNote = document.createElement('div');
            slideNote.className = 'slide-note';
            slideNote.id = `slide-note-${noteId}`;
            slideNote.dataset.lane = lane;
            slideNote.dataset.id = noteId;
            
            // 设置滑条音符位置和样式 - 确保与按键中心对齐
            const hitArea = document.getElementById(`hitArea${lane + 1}`);
            const hitAreaRect = hitArea.getBoundingClientRect();
            
            // 使用动态计算的音符大小，确保与按键完全对齐
            slideNote.style.left = `${hitAreaRect.left + hitAreaRect.width / 2 - noteWidth / 2}px`;
            slideNote.style.width = `${noteWidth}px`;
            
            // 随机滑条长度
            const length = gameConfig.slideNoteMinLength + Math.random() * (gameConfig.slideNoteMaxLength - gameConfig.slideNoteMinLength);
            slideNote.style.height = `${length}px`;
            
            // 滑条音符从屏幕上方延伸到屏幕内
            slideNote.style.top = `-${length}px`;
            
            // 设置滑条背景
            slideNote.style.backgroundColor = getLaneColor(lane, 0.3);
            slideNote.style.border = `3px solid ${getLaneColor(lane, 1)}`;
            
            // 添加滑条效果
            const gradient = document.createElement('div');
            gradient.style.position = 'absolute';
            gradient.style.top = '0';
            gradient.style.left = '0';
            gradient.style.width = '100%';
            gradient.style.height = '100%';
            gradient.style.background = `linear-gradient(to bottom, ${getLaneColor(lane, 0.8)}, ${getLaneColor(lane, 0.2)})`;
            gradient.style.borderRadius = '30px';
            slideNote.appendChild(gradient);
            
            // 添加发光效果
            const glow = document.createElement('div');
            glow.style.position = 'absolute';
            glow.style.top = '-5px';
            glow.style.left = '-5px';
            glow.style.width = 'calc(100% + 10px)';
            glow.style.height = 'calc(100% + 10px)';
            glow.style.background = `radial-gradient(circle, ${getLaneColor(lane, 0.5)} 0%, transparent 70%)`;
            glow.style.borderRadius = '35px';
            glow.style.zIndex = '-1';
            slideNote.appendChild(glow);
            
            // 添加头部指示器
            const head = document.createElement('div');
            head.className = 'slide-note-head';
            head.style.position = 'absolute';
            head.style.bottom = '0';
            head.style.left = '50%';
            head.style.transform = 'translateX(-50%)';
            head.style.width = '70%';
            head.style.height = '20px';
            head.style.backgroundColor = getLaneColor(lane, 1);
            head.style.borderRadius = '10px';
            head.style.boxShadow = `0 0 10px ${getLaneColor(lane, 0.8)}`;
            slideNote.appendChild(head);
            
            // 添加进度条容器
            const progressContainer = document.createElement('div');
            progressContainer.className = 'slide-progress-container';
            progressContainer.style.position = 'absolute';
            progressContainer.style.top = '0';
            progressContainer.style.left = '0';
            progressContainer.style.width = '100%';
            progressContainer.style.height = '100%';
            progressContainer.style.overflow = 'hidden';
            progressContainer.style.borderRadius = '30px';
            slideNote.appendChild(progressContainer);
            
            // 添加进度条
            const progressBar = document.createElement('div');
            progressBar.className = 'slide-progress-bar';
            progressBar.style.position = 'absolute';
            progressBar.style.bottom = '0';
            progressBar.style.left = '0';
            progressBar.style.width = '100%';
            progressBar.style.height = '0%';
            progressBar.style.backgroundColor = getLaneColor(lane, 0.6);
            progressBar.style.transition = 'height 0.1s linear';
            progressContainer.appendChild(progressBar);
            
            // 添加音符到游戏区域
            elements.noteArea.appendChild(slideNote);
            
            // 随机音符速度（滑条音符稍慢）
            const speed = gameConfig.minNoteSpeed + Math.random() * (gameConfig.maxNoteSpeed - gameConfig.minNoteSpeed) * 0.8;
            
            // 添加到游戏状态
            gameState.notes.push({
                id: noteId,
                lane,
                element: slideNote,
                position: -length,
                hit: false,
                speed: speed,
                type: 'slide',
                length: length,
                slideProgress: 0, // 滑条进度
                isSliding: false, // 是否正在滑动
                completed: false, // 是否已完成
                progressBar: progressBar, // 进度条元素
                createdTime: Date.now() // 创建时间
            });
            
            // 增加总音符计数
            gameState.totalNotes++;
        }
        
        // 设置音符颜色
        function setNoteColor(note, lane) {
            switch (lane) {
                case 0:
                    note.style.filter = 'drop-shadow(0 0 8px rgba(59, 130, 246, 0.8))';
                    break;
                case 1:
                    note.style.filter = 'drop-shadow(0 0 8px rgba(16, 185, 129, 0.8))';
                    break;
                case 2:
                    note.style.filter = 'drop-shadow(0 0 8px rgba(239, 68, 68, 0.8))';
                    break;
                case 3:
                    note.style.filter = 'drop-shadow(0 0 8px rgba(245, 158, 11, 0.8))';
                    break;
            }
        }
        
        // 获取轨道颜色
        function getLaneColor(lane, alpha = 1) {
            switch (lane) {
                case 0:
                    return `rgba(59, 130, 246, ${alpha})`;
                case 1:
                    return `rgba(16, 185, 129, ${alpha})`;
                case 2:
                    return `rgba(239, 68, 68, ${alpha})`;
                case 3:
                    return `rgba(245, 158, 11, ${alpha})`;
                default:
                    return `rgba(255, 255, 255, ${alpha})`;
            }
        }
        
        // 游戏主循环
        function gameLoop() {
            if (!gameState.isPlaying || gameState.isPaused) return;
            
            // 计算帧率
            const now = performance.now();
            const deltaTime = now - gameState.lastFrameTime;
            gameState.lastFrameTime = now;
            
            // 更新音符位置 - 不限制频率，确保流畅
            updateNotes();
            
            // 渲染特效
            if (gameState.effects && gameState.effects.length > 0) {
                renderEffects();
            }
            
            // Continue game loop
            requestAnimationFrame(gameLoop);
        }
        
        // 更新音符位置
        function updateNotes() {
            const hitAreaBottom = elements.hitArea1.getBoundingClientRect().bottom;
            const hitAreaTop = elements.hitArea1.getBoundingClientRect().top;
            
            // 创建要移除的音符列表
            const notesToRemove = [];
            
            gameState.notes.forEach(note => {
                // 无论是否击中，都继续更新音符位置
                note.position += note.speed;
                note.element.style.top = `${note.position}px`;
                
                // 处理滑条音符
                if (note.type === 'slide') {
                    // 如果滑条音符正在被滑动，更新进度
                    if (note.isSliding) {
                        note.slideProgress += note.speed;
                        
                        // 更新进度条显示
                        if (note.progressBar) {
                            const progressPercentage = Math.min((note.slideProgress / note.length) * 100, 100);
                            note.progressBar.style.height = `${progressPercentage}%`;
                        }
                        
                        // 检查滑条是否完成
                        if (note.slideProgress >= note.length && !note.completed) {
                            note.hit = true;
                            note.completed = true; // 标记为已完成，避免重复处理
                            showJudgeText('marvelous', note.lane);
                            addScore('marvelous');
                            playSlideSound('end');
                            notesToRemove.push(note);
                        }
                    }
                    
                    // 无论是否在滑动，都检查是否超出屏幕
                    // 滑条音符完全超出屏幕时移除
                    if (note.position > window.innerHeight + note.length || note.markedForRemoval) {
                        if (!note.hit && !note.markedForRemoval) {
                            handleMiss(note);
                        }
                        notesToRemove.push(note);
                    }
                } else {
                    // 普通音符
                    if (!note.hit && note.position > hitAreaBottom + gameConfig.judgeWindows.good) {
                        handleMiss(note);
                        notesToRemove.push(note);
                    } else if (note.hit) {
                        // 已击中的普通音符继续移动，直到超出屏幕
                        if (note.position > window.innerHeight) {
                            notesToRemove.push(note);
                        }
                    }
                }
            });
            
            // 移除标记的音符
            notesToRemove.forEach(note => {
                removeNote(note);
            });
        }
        
        // 检查错过的音符 - 暂时禁用，因为updateNotes已经处理了错过判定
        function checkMissedNotes() {
            // 这个函数现在由updateNotes处理，避免重复判定
            return;
        }
        
        // 处理按键按下 - 完全独立处理每个按键
        function handleKeyDown(event) {
            // ESC键暂停游戏
            if (event.code === 'Escape' && gameState.isPlaying) {
                pauseGame();
                return;
            }
            
            if (!gameState.isPlaying || gameState.isPaused) return;
            
            // 防止按键重复触发
            if (event.repeat) return;
            
            const lane = gameConfig.keyMapping[event.code];
            if (lane === undefined) return;
            
            // 使用requestAnimationFrame优化DOM操作
            requestAnimationFrame(() => {
                // 激活对应按键区域
                const hitArea = document.getElementById(`hitArea${lane + 1}`);
                if (hitArea) {
                    hitArea.classList.add('active');
                }
            });
            
            // 为每个按键创建独立的处理上下文
            const keyContext = {
                lane: lane,
                timestamp: Date.now(),
                event: event
            };
            
            // 使用独立的处理队列，确保按键处理不会互相阻塞
            processKeyPress(keyContext);
        }
        
        // 按键处理队列
        const keyPressQueue = [];
        let isProcessingQueue = false;
        
        // 处理按键按下的主函数
        function processKeyPress(context) {
            // 将按键添加到队列
            keyPressQueue.push(context);
            
            // 如果队列未在处理中，则开始处理
            if (!isProcessingQueue) {
                processKeyQueue();
            }
        }
        
        // 处理按键队列
        function processKeyQueue() {
            if (keyPressQueue.length === 0) {
                isProcessingQueue = false;
                return;
            }
            
            isProcessingQueue = true;
            
            // 取出队列中的第一个按键
            const context = keyPressQueue.shift();
            
            // 使用setTimeout确保即使处理过程中有错误也不会阻塞队列
            setTimeout(() => {
                try {
                    // 检查是否击中音符
                    checkNoteHit(context.lane, true);
                } catch (e) {
                    console.warn('Error processing key press:', e);
                }
                
                // 继续处理队列中的下一个按键
                processKeyQueue();
            }, 0);
        }
        
        // 处理按键松开
        function handleKeyUp(event) {
            const lane = gameConfig.keyMapping[event.code];
            if (lane === undefined) return;
            
            // 使用requestAnimationFrame优化DOM操作
            requestAnimationFrame(() => {
                // 取消激活对应按键区域
                const hitArea = document.getElementById(`hitArea${lane + 1}`);
                if (hitArea) {
                    hitArea.classList.remove('active');
                }
            });
            
            // 处理滑条音符松开 - 放在主线程但优化处理
            setTimeout(() => {
                checkSlideNoteRelease(lane);
            }, 0);
        }
        
        // 检查音符击中 - 完全独立版本
        function checkNoteHit(lane, isKeyDown) {
            try {
                // 为每个轨道创建独立的处理上下文
                const laneContext = {
                    lane: lane,
                    hitArea: null,
                    hitAreaCenter: 0,
                    notes: []
                };
                
                // 获取击中区域信息
                const hitArea = document.getElementById(`hitArea${lane + 1}`);
                if (!hitArea) return;
                
                laneContext.hitArea = hitArea;
                const hitAreaRect = hitArea.getBoundingClientRect();
                laneContext.hitAreaCenter = hitAreaRect.top + hitAreaRect.height / 2;
                
                // 检查是否有正在滑动的滑条音符（只检查当前轨道）
                const slidingNote = gameState.notes.find(note => 
                    note.lane === lane && note.type === 'slide' && note.isSliding
                );
                
                if (slidingNote) {
                    // 如果已经有正在滑动的滑条音符，不需要在按键事件中继续处理
                    return;
                }
                
                // 只获取当前轨道的未击中音符
                const laneNotes = gameState.notes.filter(note => 
                    note.lane === lane && !note.hit && note.element
                );
                
                if (laneNotes.length === 0) return;
                
                // 独立处理当前轨道的音符
                processLaneNotes(laneContext, laneNotes);
            } catch (e) {
                console.warn('Error in checkNoteHit for lane', lane, ':', e);
            }
        }
        
        // 独立处理单个轨道的音符
        function processLaneNotes(laneContext, notes) {
            try {
                // 查找最接近的音符
                let closestNote = null;
                let minDistance = Infinity;
                
                for (const note of notes) {
                    try {
                        if (!note.element) continue;
                        
                        // 获取音符位置信息
                        const noteRect = note.element.getBoundingClientRect();
                        const noteTop = noteRect.top;
                        
                        // 根据音符类型使用不同的检测逻辑
                        if (note.type === 'slide') {
                            // 滑条音符检测 - 只要顶部接近击中区域就可以开始
                            if (noteTop <= laneContext.hitAreaCenter + gameConfig.judgeWindows.good * 2 && 
                                noteTop >= laneContext.hitAreaCenter - gameConfig.judgeWindows.good * 3) {
                                closestNote = note;
                                minDistance = 0; // 滑条音符优先
                                break;
                            }
                        } else {
                            // 普通音符检测 - 检查中心距离
                            const noteCenter = noteTop + noteRect.height / 2;
                            const distance = Math.abs(noteCenter - laneContext.hitAreaCenter);
                            
                            if (distance < minDistance && distance <= gameConfig.judgeWindows.good) {
                                minDistance = distance;
                                closestNote = note;
                            }
                        }
                    } catch (e) {
                        console.warn('Error processing note in lane', laneContext.lane, ':', e);
                        continue; // 跳过有问题的音符，继续处理其他音符
                    }
                }
                
                // 如果找到可击中的音符，独立处理
                if (closestNote) {
                    // 使用setTimeout确保每个音符处理都是独立的异步操作
                    setTimeout(() => {
                        processNoteHit(closestNote, laneContext.lane, minDistance);
                    }, 0);
                }
            } catch (e) {
                console.warn('Error in processLaneNotes for lane', laneContext.lane, ':', e);
            }
        }
        
        // 处理音符击中 - 分离处理逻辑以提高性能
        function processNoteHit(note, lane, distance) {
            try {
                // 处理滑条音符
                if (note.type === 'slide') {
                    // 开始滑动
                    note.isSliding = true;
                    note.slideProgress = 0;
                    
                    // 使用requestAnimationFrame处理视觉效果
                    requestAnimationFrame(() => {
                        showSlideStartEffect(lane);
                    });
                    
                    // 播放滑条开始音效
                    playSlideSound('start');
                } else {
                    // 普通音符击中处理
                    // 根据距离判定击中质量
                    let hitQuality;
                    let score;
                    
                    if (distance <= gameConfig.judgeWindows.marvelous) {
                        hitQuality = 'Marvelous';
                        score = gameConfig.scores.marvelous;
                    } else if (distance <= gameConfig.judgeWindows.perfect) {
                        hitQuality = 'Perfect';
                        score = gameConfig.scores.perfect;
                    } else {
                        hitQuality = 'Good';
                        score = gameConfig.scores.good;
                    }
                    
                    // 使用requestAnimationFrame处理视觉效果
                    requestAnimationFrame(() => {
                        showJudgeText(hitQuality.toLowerCase(), lane);
                    });
                    
                    // 处理击中
                    handleHit(note, hitQuality, score);
                }
            } catch (e) {
                console.warn('Error in processNoteHit:', e);
            }
        }
        
        // 添加分数函数
        function addScore(type) {
            const score = gameConfig.scores[type] || 0;
            gameState.score += score;
            elements.scoreDisplay.textContent = gameState.score;
            
            // 增加击中音符计数
            gameState.hitNotes++;
            
            // 增加连击
            gameState.combo++;
            if (gameState.combo > gameState.maxCombo) {
                gameState.maxCombo = gameState.combo;
            }
            
            // 连击达到目标时的特效
            if (gameState.combo === gameState.comboTarget) {
                showComboAchievement();
            }
            
            // 更新连击显示
            updateComboDisplay();
        }
        
        // 处理音符击中
        function handleHit(note, hitQuality, score) {
            // 标记音符为已击中
            note.hit = true;
            
            // 增加分数
            gameState.score += score;
            elements.scoreDisplay.textContent = gameState.score;
            
            // 增加击中音符计数
            gameState.hitNotes++;
            
            // 增加连击
            gameState.combo++;
            if (gameState.combo > gameState.maxCombo) {
                gameState.maxCombo = gameState.combo;
            }
            
            // 连击达到目标时的特效
            if (gameState.combo === gameState.comboTarget) {
                showComboAchievement();
            }
            
            // 更新连击显示
            updateComboDisplay();
            
            // 播放击中音效
            playHitSound(hitQuality);
            
            // 显示击中特效
            showHitEffect(note.lane, hitQuality);
            
            // 显示分数弹出
            showScorePopup(note.lane, hitQuality, score);
            
            // 移除音符
            removeNote(note);
            
            // 根据连击数显示特效
            if (gameState.combo > 0 && gameState.combo % 10 === 0) {
                showComboEffect();
            }
        }
        
        // 处理音符错过
        function handleMiss(note) {
            // 重置连击
            gameState.combo = 0;
            updateComboDisplay();
            
            // 显示Miss判定文本
            if (note && note.lane !== undefined) {
                showJudgeText('miss', note.lane);
            }
            
            // 播放错过音效
            playMissSound();
            
            // 移除音符
            if (note) {
                removeNote(note);
            }
        }
        
        // 处理滑条音符释放 - 优化版本
        function checkSlideNoteRelease(lane) {
            try {
                // 查找当前轨道上正在滑动的滑条音符
                const slidingNote = gameState.notes.find(note => 
                    note.lane === lane && note.type === 'slide' && note.isSliding
                );
                
                if (slidingNote) {
                    // 立即停止滑动
                    slidingNote.isSliding = false;
                    
                    // 计算滑条完成度
                    const completionRate = slidingNote.slideProgress / slidingNote.length;
                    
                    // 使用requestAnimationFrame处理视觉效果
                    requestAnimationFrame(() => {
                        // 显示滑条结束特效
                        showSlideEndEffect(lane);
                    });
                    
                    // 震动反馈
                    if (navigator.vibrate) {
                        navigator.vibrate(15);
                    }
                    
                    // 降低完成度要求，让玩家更容易获得分数
                    if (completionRate >= 0.6) {
                        // 完成度高，给予满分
                        slidingNote.hit = true;
                        slidingNote.completed = true;
                        
                        requestAnimationFrame(() => {
                            showJudgeText('marvelous', lane);
                            // 添加特殊完成特效
                            showSlideCompleteEffect(lane);
                        });
                        
                        addScore('marvelous');
                        playSlideSound('end');
                    } else if (completionRate >= 0.3) {
                        // 完成度中等，给予部分分数
                        slidingNote.hit = true;
                        slidingNote.completed = true;
                        
                        requestAnimationFrame(() => {
                            showJudgeText('perfect', lane);
                        });
                        
                        addScore('perfect');
                        playSlideSound('end');
                    } else {
                        // 完成度低，给予最低分数而不是miss
                        slidingNote.hit = true;
                        slidingNote.completed = true;
                        
                        requestAnimationFrame(() => {
                            showJudgeText('good', lane);
                        });
                        
                        addScore('good');
                        playHitSound('Good');
                    }
                    
                    // 标记为需要移除，但不立即移除，让它继续下滑
                    slidingNote.markedForRemoval = true;
                    
                    // 清理引用
                    slidingNote.progressBar = null;
                }
            } catch (e) {
                console.warn('Error in checkSlideNoteRelease:', e);
            }
        }
        
        // 显示滑条结束特效
        function showSlideEndEffect(lane) {
            const hitArea = document.getElementById(`hitArea${lane + 1}`);
            const hitAreaRect = hitArea.getBoundingClientRect();
            
            // 创建特效元素
            const effect = document.createElement('div');
            effect.className = 'slide-end-effect';
            effect.style.position = 'absolute';
            effect.style.width = '80%';
            effect.style.height = '30px';
            effect.style.backgroundColor = getLaneColor(lane, 0.7);
            effect.style.borderRadius = '15px';
            effect.style.zIndex = '15';
            effect.style.transform = 'translateX(-50%)';
            
            // 设置位置
            effect.style.left = `${hitAreaRect.left + hitAreaRect.width / 2}px`;
            effect.style.top = `${hitAreaRect.top + hitAreaRect.height / 2 - 15}px`;
            
            // 添加到游戏区域
            elements.noteArea.appendChild(effect);
            
            // 动画效果
            gsap.to(effect, {
                scale: 1.5,
                opacity: 0,
                duration: 0.6,
                ease: 'power2.out',
                onComplete: () => {
                    effect.remove();
                }
            });
        }
        
        // 显示滑条完美完成特效
        function showSlideCompleteEffect(lane) {
            const hitArea = document.getElementById(`hitArea${lane + 1}`);
            const hitAreaRect = hitArea.getBoundingClientRect();
            
            // 创建光环效果
            for (let i = 0; i < 3; i++) {
                const ring = document.createElement('div');
                ring.className = 'slide-complete-ring';
                ring.style.position = 'absolute';
                ring.style.width = `${100 + i * 20}%`;
                ring.style.height = `${100 + i * 20}%`;
                ring.style.border = '2px solid';
                ring.style.borderColor = getLaneColor(lane, 0.8 - i * 0.2);
                ring.style.borderRadius = '50%';
                ring.style.left = `${hitAreaRect.left - hitAreaRect.width * (i * 0.1)}px`;
                ring.style.top = `${hitAreaRect.top - hitAreaRect.height * (i * 0.1)}px`;
                ring.style.zIndex = '16';
                ring.style.pointerEvents = 'none';
                elements.noteArea.appendChild(ring);
                
                // 光环动画
                gsap.to(ring, {
                    scale: 2 + i * 0.5,
                    opacity: 0,
                    duration: 1 + i * 0.2,
                    delay: i * 0.1,
                    ease: 'power2.out',
                    onComplete: () => {
                        ring.remove();
                    }
                });
            }
            
            // 创建爆炸粒子
            for (let i = 0; i < 20; i++) {
                const particle = document.createElement('div');
                particle.className = 'slide-complete-particle';
                particle.style.position = 'absolute';
                particle.style.width = `${4 + Math.random() * 4}px`;
                particle.style.height = `${4 + Math.random() * 4}px`;
                particle.style.backgroundColor = getLaneColor(lane, 0.8 + Math.random() * 0.2);
                particle.style.borderRadius = '50%';
                particle.style.left = `${hitAreaRect.left + hitAreaRect.width / 2}px`;
                particle.style.top = `${hitAreaRect.top + hitAreaRect.height / 2}px`;
                particle.style.zIndex = '15';
                particle.style.pointerEvents = 'none';
                elements.noteArea.appendChild(particle);
                
                // 随机方向和距离
                const angle = Math.random() * Math.PI * 2;
                const distance = 30 + Math.random() * 40;
                const finalX = Math.cos(angle) * distance;
                const finalY = Math.sin(angle) * distance;
                
                // 粒子动画
                gsap.to(particle, {
                    x: finalX,
                    y: finalY,
                    opacity: 0,
                    duration: 0.8 + Math.random() * 0.4,
                    ease: 'power2.out',
                    onComplete: () => {
                        particle.remove();
                    }
                });
            }
        }
        
        // 显示判定文本
        function showJudgeText(judgeType, lane) {
            const hitArea = document.getElementById(`hitArea${lane + 1}`);
            const hitAreaRect = hitArea.getBoundingClientRect();
            
            // 创建判定文本元素
            const judgeText = document.createElement('div');
            judgeText.className = `judge-text judge-${judgeType}`;
            judgeText.textContent = judgeType.toUpperCase();
            
            // 设置位置在击中区域上方
            judgeText.style.left = `${hitAreaRect.left + hitAreaRect.width / 2}px`;
            judgeText.style.top = `${hitAreaRect.top - 30}px`;
            
            // 添加到游戏区域
            elements.noteArea.appendChild(judgeText);
            
            // 动画效果
            gsap.to(judgeText, {

        // 显示连击特效
        function showComboEffect() {
            // 在画布上绘制特效
            const canvas = elements.gameCanvas;
            const ctx = canvas.getContext('2d');
            
            // 清除画布
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 绘制背景特效
            const gradient = ctx.createRadialGradient(
                canvas.width / 2, canvas.height / 2, 0,
                canvas.width / 2, canvas.height / 2, canvas.width / 2
            );
            
            gradient.addColorStop(0, 'rgba(236, 72, 153, 0.5)');
            gradient.addColorStop(0.5, 'rgba(139, 92, 246, 0.3)');
            gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
            
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // 绘制粒子
            const particles = [];
            const particleCount = 100;
            
            for (let i = 0; i < particleCount; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    size: Math.random() * 4 + 1,
                    speedX: (Math.random() - 0.5) * 2,
                    speedY: (Math.random() - 0.5) * 2,
                    color: `rgba(${Math.floor(Math.random() * 255)}, ${Math.floor(Math.random() * 255)}, ${Math.floor(Math.random() * 255)}, ${Math.random() * 0.8 + 0.2})`
                });
            }
            
            // 动画循环
            let animationFrame;
            let alpha = 1;
            
            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                // 绘制背景
                ctx.globalAlpha = alpha;
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                // 绘制粒子
                particles.forEach(particle => {
                    ctx.fillStyle = particle.color;
                    ctx.beginPath();
                    ctx.arc(particle.x, particle.y, particle.size, 0, Math.PI * 2);
                    ctx.fill();
                    
                    particle.x += particle.speedX;
                    particle.y += particle.speedY;
                    
                    // 边界检查
                    if (particle.x < 0 || particle.x > canvas.width) particle.speedX *= -1;
                    if (particle.y < 0 || particle.y > canvas.height) particle.speedY *= -1;
                });
                
                // 淡出效果
                alpha -= 0.02;
                
                if (alpha > 0) {
                    animationFrame = requestAnimationFrame(animate);
                } else {
                    cancelAnimationFrame(animationFrame);
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                }
            }
            
            animate();
        }

            try {

                const notes = [523.25, 659.25, 783.99, 1046.5]; // C-E-G-C 和弦
                
                notes.forEach((frequency, index) => {
                    setTimeout(() => {
                        const oscillator = audioContext.createOscillator();
                        const gainNode = audioContext.createGain();
                        
                        oscillator.connect(gainNode);
                        gainNode.connect(audioContext.destination);
                        
                        gainNode.gain.value = 0.1;
                        oscillator.type = 'sine';
                        oscillator.frequency.value = frequency;
                        
                        oscillator.start();
                        
                        gainNode.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + 1);

                    }, index * 150);

                console.warn('Failed to play combo achievement sound:', e);

        // 移除音符 - 修复版本
        function removeNote(note) {
            // 从DOM中移除
            if (note.element) {
                try {
                    // 添加移除动画
                    gsap.to(note.element, {
                        opacity: 0,
                        scale: 0.8,
                        duration: 0.2,
                        onComplete: () => {
                            try {
                                if (note.element && note.element.parentNode) {
                                    note.element.remove();
                                }
                            } catch (e) {
                                console.warn('Error in animation onComplete:', e);
                            }
                        }
                    });
                } catch (e) {
                    console.warn('Error starting removal animation:', e);
                    // 如果动画失败，直接尝试移除元素
                    try {
                        if (note.element.parentNode) {
                            note.element.remove();
                        }
                    } catch (e2) {
                        console.warn('Error removing element directly:', e2);
                    }
                }
            }
            
            // 从游戏状态中移除
            const index = gameState.notes.findIndex(n => n.id === note.id);
            if (index !== -1) {
                gameState.notes.splice(index, 1);
            }
            
            // 清理所有相关引用，防止内存泄漏
            if (note.progressBar) {
                note.progressBar = null;
            }
            note.element = null;
        }

        // 播放滑条音效
        function playSlideSound(type) {
            if (!audioContext) return;
            
            try {
                // 创建振荡器
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                // 连接节点
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                // 设置音量
                gainNode.gain.value = 0.2;
                
                // 根据滑条类型设置音频参数
                if (type === 'start') {
                    oscillator.type = 'sine';
                    oscillator.frequency.value = 660; // E5音
                    gainNode.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + 0.15);
                } else { // end
                    oscillator.type = 'sine';
                    oscillator.frequency.value = 880; // A5音
                    gainNode.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + 0.2);
                }
                
                // 播放音频
                oscillator.start();
                
                // 停止音频
                setTimeout(() => oscillator.stop(), type === 'start' ? 150 : 200);
            } catch (e) {
                console.warn('Failed to play slide sound:', e);
            }
        }
        
        // 播放错过音效
        function playMissSound() {
            if (!audioContext) return;
            
            try {
                // 创建振荡器
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                // 连接节点
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                // 设置音量
                gainNode.gain.value = 0.1;
                
                // 设置音频参数
                oscillator.type = 'sawtooth';
                oscillator.frequency.value = 220; // A3音
                
                // 播放音频
                oscillator.start();
                
                // 快速淡出
                gainNode.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + 0.2);
                setTimeout(() => oscillator.stop(), 200);
            } catch (e) {
                console.warn('Failed to play miss sound:', e);
            }
        }
        
        // 初始化游戏
        // 处理触摸事件
        function handleTouch(event) {
            if (!gameState.isPlaying || gameState.isPaused) return;
            
            // 防止默认行为（如滚动）
            event.preventDefault();
            
            // 获取触摸目标
            const target = event.target;
            
            // 检查是否点击了按键区域
            if (target.classList.contains('hit-area')) {
                // 获取按键区域的ID
                const hitAreaId = target.id;
                // 提取轨道号（从1开始）
                const lane = parseInt(hitAreaId.replace('hitArea', '')) - 1;
                
                // 使用requestAnimationFrame优化DOM操作
                requestAnimationFrame(() => {
                    // 激活对应按键区域
                    target.classList.add('active');
                });
                
                // 为每个按键创建独立的处理上下文
                const touchContext = {
                    lane: lane,
                    timestamp: Date.now(),
                    event: event
                };
                
                // 使用独立的处理队列，确保按键处理不会互相阻塞
                processKeyPress(touchContext);
            }
        }
        
        // 检测设备类型并设置相应的控制说明
        function setupDeviceControls() {
            const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
            const instructions = document.getElementById('controlInstructions');
            
            if (isMobile) {
                instructions.textContent = 'Tap the colored areas to match falling notes';
                
                // 为按键区域添加触摸事件监听器
                const hitAreas = document.querySelectorAll('.hit-area');
                hitAreas.forEach(area => {
                    area.addEventListener('touchstart', handleTouch, { passive: false });
                });
            } else {
                instructions.textContent = 'Use keyboard keys A S D F to match falling notes';
            }
        }
        
        window.addEventListener('DOMContentLoaded', function() {
            initGame();
            
            // 初始化时间选择器
            const timeSlider = document.getElementById('timeSlider');
            const timeLabel = document.getElementById('timeLabel');
            
            timeSlider.addEventListener('input', function() {
                const minutes = parseInt(this.value);
                timeLabel.textContent = `${minutes}:00`;
                gameConfig.gameDuration = minutes * 60000; // 转换为毫秒
            });
            
            // 设置设备控制
            setupDeviceControls();
        });
    </script>

</body></html>
